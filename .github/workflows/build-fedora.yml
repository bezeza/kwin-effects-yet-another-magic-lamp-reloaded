name: Build (Fedora)

on:
  push:
    branches: [master, feature/coordinate-mapper-2.0, 'fix/**']
  pull_request:
    branches: [master, feature/coordinate-mapper-2.0, 'fix/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: fedora:latest

    steps:
      - name: Update system
        run: dnf update -y

      - name: Install dependencies
        run: dnf install -y
          cmake extra-cmake-modules kf6-kconfig-devel kf6-kconfigwidgets-devel
          kf6-kcoreaddons-devel kf6-kcmutils-devel kf6-kwindowsystem-devel
          kwin-devel qt6-qtbase-devel libdrm-devel libepoxy-devel vulkan-headers

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 60 --parallel 2
