name: Build (Arch Linux)

on:
  push:
    branches: [master, feature/coordinate-mapper-2.0, 'fix/**']
  pull_request:
    branches: [master, feature/coordinate-mapper-2.0, 'fix/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: archlinux:latest

    steps:
      - name: Update system
        run: pacman -Syu --noconfirm

      - name: Install dependencies
        run: pacman -S --noconfirm --needed
          base-devel cmake extra-cmake-modules kwin qt6-base kcmutils
          kconfig kconfigwidgets kcoreaddons kwindowsystem libdrm vulkan-headers

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 60 --parallel 2
