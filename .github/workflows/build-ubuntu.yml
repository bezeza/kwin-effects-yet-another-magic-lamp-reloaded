name: Build (Ubuntu)

on:
  push:
    branches: [master, feature/coordinate-mapper-2.0, 'fix/**']
  pull_request:
    branches: [master, feature/coordinate-mapper-2.0, 'fix/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: ubuntu:rolling

    steps:
      - name: Update package indexes
        run: apt update && apt install -y bash

      - name: Check KWin version
        id: kwin-version
        shell: bash
        run: |
          version=$(apt-cache policy kwin-dev | awk '/Candidate:/ {print $2}')
          if [[ "$version" == "(none)" || -z "$version" ]]; then
            echo "No KWin development package is available in this Ubuntu image."
            echo "skip=true" >> "$GITHUB_ENV"
            exit 0
          fi
          major=$(echo "$version" | grep -oP '^\d+' || true)
          minor=$(echo "$version" | grep -oP '^\d+\.\K\d+' || true)
          echo "Available kwin-dev: $version"
          if [[ -z "$major" || -z "$minor" ]] || [[ "$major" -lt 6 ]] || { [[ "$major" -eq 6 ]] && [[ "$minor" -lt 6 ]]; }; then
            echo "KWin $version does not meet the minimum requirement of 6.6."
            echo "skip=true" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        if: env.skip != 'true'
        run: apt install -y
          build-essential cmake extra-cmake-modules kwin-dev libkf6config-dev
          libkf6configwidgets-dev libkf6coreaddons-dev libkf6kcmutils-dev
          libkf6windowsystem-dev qt6-base-dev libdrm-dev libvulkan-dev

      - name: Checkout
        if: env.skip != 'true'
        uses: actions/checkout@v4

      - name: Configure
        if: env.skip != 'true'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DBUILD_TESTING=ON

      - name: Build
        if: env.skip != 'true'
        run: cmake --build build --parallel 2

      - name: Test
        if: env.skip != 'true'
        run: ctest --test-dir build --output-on-failure --timeout 60 --parallel 2
